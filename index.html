<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slot-machine">
        <div class="reel" id="reel1">
          <div class="symbol-container" id="symbol-container1">
            <!-- Symbols are repeated twice to create a loop effect -->
            <div class="symbol">🍒</div>
            <div class="symbol">🍋</div>
            <div class="symbol">🍇</div>
            <div class="symbol">🍉</div>
            <div class="symbol">⭐</div>
            <div class="symbol">🍒</div>
            <div class="symbol">🍋</div>
            <div class="symbol">🍇</div>
            <div class="symbol">🍉</div>
            <div class="symbol">⭐</div>
          </div>
        </div>
        <div class="reel" id="reel2">
          <div class="symbol-container" id="symbol-container2">
            <div class="symbol">🍒</div>
            <div class="symbol">🍋</div>
            <div class="symbol">🍇</div>
            <div class="symbol">🍉</div>
            <div class="symbol">⭐</div>
            <div class="symbol">🍒</div>
            <div class="symbol">🍋</div>
            <div class="symbol">🍇</div>
            <div class="symbol">🍉</div>
            <div class="symbol">⭐</div>
          </div>
        </div>
        <div class="reel" id="reel3">
          <div class="symbol-container" id="symbol-container3">
            <div class="symbol">🍒</div>
            <div class="symbol">🍋</div>
            <div class="symbol">🍇</div>
            <div class="symbol">🍉</div>
            <div class="symbol">⭐</div>
            <div class="symbol">🍒</div>
            <div class="symbol">🍋</div>
            <div class="symbol">🍇</div>
            <div class="symbol">🍉</div>
            <div class="symbol">⭐</div>
          </div>
        </div>
    
        <div class="handle" id="handle"></div>
    
        <div class="result-message" id="resultMessage">You Win!</div>
     
    
      <div id="confetti" class="confetti"></div>
      
</body>
<script src="script.js"></script>
</html>
